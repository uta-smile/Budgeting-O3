target:
  name: 1cll
  # Paper/PDB-observed 1CLL chain A construct: 144 residues. The commonly
  # distributed 148-residue sequence starts with ADQ and ends with K; this
  # benchmark sequence is full_sequence[3:-1], matching the observed PDB
  # coordinates and the paper's stated length and D=3552 latent width.
  sequence: LTEEQIAEFKEAFSLFDKDGDGTITTKELGTVMRSLGQNPTEAELQDMINEVDADGNGTIDFPEFLTMMARKMKDTDSEEEIREAFRVFDKDGNGYISAAELRHVMTNLGEKLTDEEVDEMIREADIDGDGQVNYEEFVQMMTA
  reference_pdb: data/1CLL.pdb
  reference_chain: A

# Derive this from the explicitly padded Boltz sampler tensor below. The paper
# uses 1,184 sampler coordinate slots, giving a 3,552-value latent.
latent_dim: auto

# The generator uses the vendored Boltz-2 implementation. The input YAML uses
# ``msa: empty`` so this benchmark runs in single-sequence mode. The paper
# does not specify an MSA source; retrieval can be enabled only as a separate
# ablation.
boltz2:
  input_yaml: data/1cll_boltz_input.yaml
  processed_dir: data/boltz2_1cll
  use_msa_server: false
  msa_server_url: https://api.colabfold.com
  recycling_steps: 3
  sampling_steps: 200
  step_scale: 1.5
  # Ordinary stochastic Boltz-2 setting used by Best K-of-N. O3 overrides
  # gamma_0 to zero per call for deterministic PF-ODE sampling.
  stochastic_gamma_0: 0.8
  # Best K-of-N and O3 both receive an explicit z ~ N(0,I); stochastic mode
  # additionally applies Boltz-2 churn and random SE(3) augmentation.
  explicit_latent: true
  # Match an unflagged upstream ``boltz predict`` invocation. Set true only
  # when deliberately reproducing a command that passes --subsample_msa.
  subsample_msa: false
  num_subsampled_msa: 1024
  # Upstream Boltz-2's Lightning CLI uses bf16 mixed precision for inference.
  inference_precision: bf16-mixed
  # Paper Section 4: Z = R^(1184*3). Boltz treats the extra slots as masked
  # padding and removes them before writing/scoring the 1,134 real atoms.
  atom_slots: 1184
  # Optional cuEquivariance kernels require glibc newer than the lab node has.
  # The model still runs on the GPU through regular PyTorch CUDA operations.
  no_kernels: true
  # O3 uses PF-ODE; Best K-of-N overrides this to the stochastic sampler.
  deterministic: true

# Best K-of-N follows the paper and uses ordinary stochastic Boltz-2 sampling.
best_k_of_n:
  deterministic: false
  # The paper's stated algorithm ranks by external TM-score. Set this to
  # model_ptm only for the diagnostic alternative described in README.md.
  selection_metric: oracle_tm_score

# Main-text benchmark K values with the O3 appendix M,d settings. The paper's
# Appendix Table A.1 has inconsistent K values for some rows; the main-text
# benchmark values are used for returned-candidate metrics here.
budgets:
  - name: n20_k2
    N: 20
    K: 2
    M: 10
    d: 5
  - name: n50_k5
    N: 50
    K: 5
    M: 25
    d: 7
  - name: n100_k10
    N: 100
    K: 10
    M: 50
    d: 5
  - name: n200_k20
    N: 200
    K: 20
    M: 100
    d: 10
  - name: n500_k50
    N: 500
    K: 50
    M: 250
    d: 30
  - name: n1000_k100
    N: 1000
    K: 100
    M: 400
    d: 50

# The paper repeats each configuration over five random seeds.
# Set seed to any integer to choose the first replicate; later replicates use
# seed + seed_step. The CLI can override both values with --seed-start and
# --seed-step.
replicates: 5
seed: 0
seed_step: 1
output_dir: outputs
