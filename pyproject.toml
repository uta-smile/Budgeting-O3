[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "o3-boltz2-experiment"
version = "0.1.0"
description = "Budgeted O3 Bayesian optimization around a deterministic Boltz-2 adapter"
requires-python = ">=3.10,<3.13"
dependencies = [
    "botorch>=0.14.0",
    "gpytorch>=1.13.0",
    "numpy>=1.26,<2.0",
    # Required by the paper's inverse-Beta Knothe--Rosenblatt chart. This
    # Boltz 2.2.1 pins SciPy 1.13.1; it provides the inverse-Beta function
    # needed by the paper's Knothe--Rosenblatt chart.
    "scipy==1.13.1",
    "pyyaml>=6.0.2",
    # Windows/RTX 50-series: PyTorch 2.7 CUDA 12.8 supports Blackwell.
    "torch==2.7.0+cu128; sys_platform == 'win32'",
    # Linux lab node: retain the original CUDA 11.8 build.
    "torch==2.5.1+cu118; sys_platform == 'linux'",
    # Keep a broadly compatible binary-wheel version.
    "pillow==10.4.0",
    # Satisfies Boltz's >=2.2.2 requirement.
    "pandas==2.2.3",
    # Boltz's current molecule cache uses RDKit pickle format 16.2.
    # Windows can use a newer wheel; keep the older Linux pin for the lab node.
    "rdkit>=2025.03.1; sys_platform == 'win32'",
    "rdkit==2024.3.2; sys_platform == 'linux'",
    "tmtools>=0.1.0",
    # The optional cuEquivariance wheels require newer glibc than the lab node.
    # Boltz still uses the GPU through CUDA-enabled PyTorch without these kernels.
    "boltz>=2.2.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
# Use the vendored Boltz source because the experiment adds an opt-in
# deterministic latent/PF-ODE entry point to it.
boltz = { path = "vendor/boltz", editable = true }
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cu118", marker = "sys_platform == 'linux'" },
]
